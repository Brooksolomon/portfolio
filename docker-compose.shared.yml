# Deploy variant for a server running the SHARED Traefik proxy (see server-infra).
# The project's own Caddy is NOT started (use --scale caddy=0); instead the web
# container joins the external "proxy" network and carries Traefik labels so
# the central Traefik picks it up automatically — no central routing file to
# edit, no reload step.
#
#   docker network create proxy        # one time, server-wide
#   docker compose -f docker-compose.yml -f docker-compose.shared.yml \
#       --env-file .env.prod up -d --build --scale caddy=0
#
# Traefik issues the HTTPS cert for solocodes.dev automatically on first
# request (DNS-01, ~30s).

services:
  web:
    container_name: portfolio-web
    # Docker auto-injects HOSTNAME=<container-id> into every container; Next.js's
    # standalone server reads that as its bind address instead of 0.0.0.0, so it
    # ends up listening on loopback only — unreachable from Traefik on the proxy
    # network. Override it explicitly.
    environment:
      - HOSTNAME=0.0.0.0
    networks:
      - default
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.portfolio.rule=Host(`solocodes.dev`)
      - traefik.http.routers.portfolio.entrypoints=websecure
      - traefik.http.routers.portfolio.tls.certresolver=letsencrypt
      - traefik.http.services.portfolio.loadbalancer.server.port=3000
      - traefik.http.middlewares.portfolio-compress.compress=true
      - traefik.http.routers.portfolio.middlewares=portfolio-compress

  # postgres remains on the project's default (private) network only.

networks:
  proxy:
    external: true
